name: Update GitHub Coding Stats

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Live GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-stats.mjs

      - name: Commit and Push Updated Stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update github coding stats [skip ci]"
          branch: main
          file_pattern: "data/coding-stats.json"
